# ============================================================================
# Nginx reverse-proxy — LR Time beta
#
# Routes :
#   /api/         → Django (gunicorn)
#   /admin/       → Django admin
#   /static/      → fichiers collectés par collectstatic
#   /media/       → uploads utilisateurs
#   /health/      → Django health
#   /             → Next.js frontend
# ============================================================================

upstream lrtime_backend {
    server web:8000;
}

upstream lrtime_frontend {
    server frontend:3000;
}

# ---- HTTP : challenge ACME + redirect HTTPS --------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Tout le reste → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS : application ---------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Certificats (mis en place par certbot — voir DEPLOY_BETA.md)
    ssl_certificate     /etc/letsencrypt/live/lrtime/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lrtime/privkey.pem;

    # TLS durci
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Headers sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 25M;

    # Statics Django (admin + DRF browsable API)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }

    # Backend Django : API, admin, auth, health, legal
    location ~ ^/(api|admin|health|ready|legal|metrics)/ {
        proxy_pass http://lrtime_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # Tout le reste → Next.js
    location / {
        proxy_pass http://lrtime_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
