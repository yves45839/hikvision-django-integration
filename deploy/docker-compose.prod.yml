###############################################################################
# LR Time — Beta production stack
# Usage : docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d
###############################################################################

services:

  db:
    image: postgres:16-alpine
    container_name: lrtime_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lrtime}
      POSTGRES_USER: ${POSTGRES_USER:-lrtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lrtime} -d ${POSTGRES_DB:-lrtime}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lrtime_net

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lrtime_web
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: "0"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      DATABASE_URL: "postgres://${POSTGRES_USER:-lrtime}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lrtime}"
      LANGUAGE_CODE: ${LANGUAGE_CODE:-fr}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KMS_KEY: ${KMS_KEY:?KMS_KEY (Fernet) is required}
      # CORS / frontend
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      FRONTEND_AUTH_BASE_URL: ${FRONTEND_AUTH_BASE_URL}
      # JWT
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
      # Email (Postmark/SES/SMTP — voir .env.production.example)
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-mail.label-ci.com}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@label-ci.com}
      # Hikvision gateway
      HIK_DEVICE_GATEWAY_BASE_URL: ${HIK_DEVICE_GATEWAY_BASE_URL}
      HIK_DEVICE_GATEWAY_USERNAME: ${HIK_DEVICE_GATEWAY_USERNAME}
      HIK_DEVICE_GATEWAY_PASSWORD: ${HIK_DEVICE_GATEWAY_PASSWORD}
      HIK_GATEWAY_WEBHOOK_TOKEN: ${HIK_GATEWAY_WEBHOOK_TOKEN}
      HIK_GATEWAY_ALLOWED_IPS: ${HIK_GATEWAY_ALLOWED_IPS}
      # Sentry (optionnel)
      SENTRY_DSN: ${SENTRY_DSN}
      # Beta : Stripe désactivé (clés vides). Le flag BETA_MODE court-circuite le billing.
      BETA_MODE: "1"
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLISHABLE_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      # TLS via reverse proxy nginx
      SECURE_PROXY_SSL_HEADER_NAME: "HTTP_X_FORWARDED_PROTO"
      SECURE_PROXY_SSL_HEADER_VALUE: "https"
      SECURE_SSL_REDIRECT: "0"
      SECURE_HSTS_SECONDS: "31536000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py createcachetable &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -
      "
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/media
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - lrtime_net

  frontend:
    build:
      context: ../v0-secure-point-dashboard-design
      dockerfile: ../deploy/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
        NEXT_PUBLIC_EMPLOYEE_API_BASE_URL: ${NEXT_PUBLIC_EMPLOYEE_API_BASE_URL:-${NEXT_PUBLIC_API_BASE_URL}}
        NEXT_PUBLIC_BETA_MODE: "1"
        NEXT_PUBLIC_EMPLOYEE_API_ENABLED: "true"
    container_name: lrtime_frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
      NEXT_PUBLIC_EMPLOYEE_API_BASE_URL: ${NEXT_PUBLIC_EMPLOYEE_API_BASE_URL:-${NEXT_PUBLIC_API_BASE_URL}}
      NEXT_PUBLIC_BETA_MODE: "1"
      NEXT_PUBLIC_EMPLOYEE_API_ENABLED: "true"
      NODE_ENV: production
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - lrtime_net

  # ---- Catchup Hikvision (cron léger, pas de Celery requis pour la beta) ----
  catchup:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lrtime_catchup
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DATABASE_URL: "postgres://${POSTGRES_USER:-lrtime}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lrtime}"
      KMS_KEY: ${KMS_KEY}
      HIK_DEVICE_GATEWAY_BASE_URL: ${HIK_DEVICE_GATEWAY_BASE_URL}
      HIK_DEVICE_GATEWAY_USERNAME: ${HIK_DEVICE_GATEWAY_USERNAME}
      HIK_DEVICE_GATEWAY_PASSWORD: ${HIK_DEVICE_GATEWAY_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BETA_MODE: "1"
    depends_on:
      web:
        condition: service_healthy
    command: >
      sh -c "
      while true; do
        echo \"[catchup] $$(date -u +%FT%TZ) — lancement hik_catchup_acs_events\";
        python manage.py hik_catchup_acs_events || echo '[catchup] erreur (ignorée)';
        sleep 30;
      done
      "
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - lrtime_net

  qcluster:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lrtime_qcluster
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DATABASE_URL: "postgres://${POSTGRES_USER:-lrtime}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lrtime}"
      KMS_KEY: ${KMS_KEY}
      HIK_DEVICE_GATEWAY_BASE_URL: ${HIK_DEVICE_GATEWAY_BASE_URL}
      HIK_DEVICE_GATEWAY_USERNAME: ${HIK_DEVICE_GATEWAY_USERNAME}
      HIK_DEVICE_GATEWAY_PASSWORD: ${HIK_DEVICE_GATEWAY_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BETA_MODE: "1"
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "manage.py", "qcluster"]
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - lrtime_net

  nginx:
    image: nginx:1.27-alpine
    container_name: lrtime_nginx
    depends_on:
      - web
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # _active-nginx.conf est créé par bootstrap-tls.sh (= nginx-bootstrap.conf
      # avant le 1er cert, puis = nginx.conf une fois HTTPS actif).
      - ./_active-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/var/www/static:ro
      - mediafiles:/var/www/media:ro
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      - lrtime_net

  certbot:
    image: certbot/certbot:latest
    container_name: lrtime_certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  pgdata:
  staticfiles:
  mediafiles:
  certbot-www:
  certbot-certs:

networks:
  lrtime_net:
    driver: bridge
