<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>API Testing — Device Gateway · SecurePoint</title>

  <style>
    /* === SecurePoint — Design tokens === */
    :root {
      --bg:         oklch(0.985 0.003 90);
      --surface:    oklch(1 0 0);
      --surface-2:  oklch(0.975 0.005 90);
      --surface-3:  oklch(0.955 0.006 90);
      --line:       oklch(0.92 0.005 90);
      --line-2:     oklch(0.88 0.006 90);
      --ink:        oklch(0.22 0.012 250);
      --ink-2:      oklch(0.42 0.01 250);
      --ink-3:      oklch(0.58 0.008 250);
      --ink-4:      oklch(0.72 0.006 250);
      --brand:      oklch(0.46 0.085 165);
      --brand-2:    oklch(0.55 0.09 165);
      --brand-soft: oklch(0.95 0.025 165);
      --brand-ink:  oklch(0.32 0.07 165);
      --success:    oklch(0.62 0.13 155);
      --success-soft: oklch(0.95 0.03 155);
      --danger:     oklch(0.62 0.18 25);
      --danger-soft: oklch(0.96 0.03 25);
      --danger-ink: oklch(0.42 0.15 25);
      --info:       oklch(0.6 0.12 240);
      --info-soft:  oklch(0.96 0.025 240);
      --r-1: 6px; --r-2: 10px; --r-3: 14px;
      --shadow-sm: 0 1px 0 oklch(0 0 0 / .04), 0 1px 2px oklch(0 0 0 / .04);
      --font-sans: "Inter", -apple-system, system-ui, sans-serif;
      --font-display: "Inter Tight", "Inter", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--font-sans);
      color: var(--ink);
      background: var(--bg);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    /* === Shell === */
    .shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }

    /* === Sidebar === */
    .sb {
      background: var(--surface);
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
      padding: 14px 10px; gap: 2px;
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .sb-brand {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 8px 14px; margin-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }
    .sb-logo {
      width: 30px; height: 30px; border-radius: 9px;
      background: var(--brand); color: white;
      display: grid; place-items: center;
      font-family: var(--font-display); font-weight: 700; font-size: 13px;
      flex-shrink: 0;
    }
    .sb-name  { font-family: var(--font-display); font-weight: 600; font-size: 14.5px; letter-spacing: -0.015em; }
    .sb-tenant { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
    .sb-section {
      font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--ink-4); font-weight: 600; padding: 12px 10px 4px;
    }
    .sb-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 10px; border-radius: 8px;
      text-decoration: none; color: var(--ink-2); font-size: 13.5px;
      position: relative; transition: background 0.1s;
    }
    .sb-item:hover { background: var(--surface-2); color: var(--ink); }
    .sb-item.active { background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; }
    .sb-item.active::before {
      content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px;
      width: 3px; background: var(--brand); border-radius: 0 3px 3px 0;
    }
    .sb-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.8;
      stroke: currentColor; fill: none; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round; }

    /* === Main === */
    .main { display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
    .topbar {
      height: 56px; border-bottom: 1px solid var(--line);
      background: var(--surface);
      display: flex; align-items: center; padding: 0 28px; gap: 10px;
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-left { display: flex; flex-direction: column; justify-content: center; }
    .topbar-left .crumb { font-size: 11.5px; color: var(--ink-4); margin-bottom: 1px; }
    .topbar-left h1 {
      font-family: var(--font-display); font-size: 15px; font-weight: 600;
      letter-spacing: -0.015em; margin: 0; color: var(--ink);
    }
