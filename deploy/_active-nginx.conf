# ============================================================================
# Config nginx temporaire pour le PREMIER démarrage (avant Let's Encrypt).
# Elle ne sert QUE le challenge ACME pour permettre à certbot de récupérer
# le premier certificat. Une fois le cert obtenu, on bascule sur nginx.conf.
#
# Usage : copier ce fichier à la place de nginx.conf, démarrer la stack,
#         lancer certbot, puis remettre nginx.conf et `docker compose restart nginx`.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 200 'LR Time beta — bootstrap en cours...\n';
        add_header Content-Type text/plain;
    }
}
